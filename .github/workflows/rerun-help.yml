name: PR Workflow Retry Help

on:
  workflow_run:
    workflows:
      - Actionlint
      - Build
      - Deploy Documentation to GitHub Pages
      - Disconnected Readiness
      - E2E collection
      - MaaS API
      - MaaS Controller
      - OpenAPI Validation
      - Operator Chaos
      - PR Title Validation
      - Semgrep TLS Rules
      - TLS Config Lint
    types: [completed]

permissions: {}

concurrency:
  # Keep the shared PR comment serialized across pushes, including fork PRs
  # whose workflow_run.pull_requests array may be empty.
  group: rerun-help-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
  # Late failures from older commits must not replace a queued current failure.
  queue: max

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            // workflow_run.pull_requests can be empty for fork PRs. Resolve
            // by head branch and repository, then verify the current SHA.
            const headOwner = run.head_repository?.owner?.login;
            if (!headOwner) return;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${headOwner}:${run.head_branch}`,
              per_page: 100,
            });
            for (const pr of pulls) {
              if (pr.head.sha !== run.head_sha ||
                  pr.head.repo?.id !== run.head_repository.id) continue;
              const marker = '<!-- maas-rerun-help -->';
              const guide = `https://github.com/${owner}/${repo}/blob/HEAD/CONTRIBUTING.md#retrying-github-actions`;
              const body = [
                marker,
                `A GitHub Actions [workflow failed](${run.html_url}) for commit ${run.head_sha.slice(0, 12)}.`,
                '',
                'Check the logs first. For a transient failure, an owner, organization member, collaborator, or previous contributor can comment `/rerun-failed`.',
                '',
                'Use `/rerun-all` to retry all jobs in failed or cancelled workflows, or `/rerun-workflow <name>` for one workflow. Put the command on its own line.',
                '',
                `See [retry instructions](${guide}) for scope and permissions. These commands do not retry Konflux/Prow checks or approve blocked workflows.`,
              ].join('\n');
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
              if (existing) {
                if (existing.body !== body) await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
              }
            }
