name: Re-Run PR Workflows

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  rerun:
    name: rerun
    if: >-
      github.event.issue.pull_request != '' &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/rerun-all') ||
       contains(github.event.comment.body, '/rerun-failed') ||
       contains(github.event.comment.body, '/rerun-workflow ')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'CONTRIBUTOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rerun workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Parse before making API calls; quoted mentions and command prefixes
          # must not accidentally rerun CI.
          COMMAND=$(printf '%s\n' "$COMMENT_BODY" | grep -m1 '^/rerun-' || true)
          # GitHub comments may use CRLF line endings.
          COMMAND=${COMMAND%$'\r'}
          TARGET_WORKFLOW=""
          case "$COMMAND" in
            /rerun-failed) MODE="--failed" ;;
            /rerun-all) MODE="" ;;
            /rerun-workflow\ *)
              MODE=""
              TARGET_WORKFLOW=${COMMAND#"/rerun-workflow "}
              TARGET_WORKFLOW=$(printf '%s' "$TARGET_WORKFLOW" | sed 's/[[:space:]]*$//; s/^"\(.*\)"$/\1/')
              if [ -z "$TARGET_WORKFLOW" ]; then
                echo "::error::Usage: /rerun-workflow <name>"
                exit 1
              fi
              ;;
            *)
              echo "::error::Expected /rerun-failed, /rerun-all, or /rerun-workflow <name> on its own line"
              exit 1
              ;;
          esac

          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Failed to resolve HEAD SHA for PR #${PR_NUMBER}"
            exit 1
          fi
          echo "PR #${PR_NUMBER} HEAD SHA: ${HEAD_SHA}"

          FAILURES=0
          rerun_workflow() {
            local run_id=$1 mode=$2
            local name
            name=$(gh run view "$run_id" --json name -q .name)
            echo "Rerunning ${mode:-all} jobs in '${name}' (run ${run_id})..."
            # shellcheck disable=SC2086 # $mode must be unquoted: empty string should vanish, not pass ""
            if ! gh run rerun "$run_id" $mode; then
              echo "::warning::Failed to rerun ${run_id}"
              FAILURES=$((FAILURES + 1))
            fi
          }

          # Note: only covers pull_request runs. Workflows using pull_request_target
          # are excluded; only retry workflows that test the PR itself.
          # A cancelled workflow can leave failed or skipped dependent checks.
          # Include those runs so a rerun can recover from cancelled prerequisites.
          RUNS=$(gh api --paginate "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&status=completed" \
            --jq '.workflow_runs[]
              | select(.conclusion == "failure" or .conclusion == "cancelled")
              | [.id, .conclusion]
              | @tsv')

          if [ -z "$RUNS" ]; then
            echo "No failed or cancelled workflow runs found for PR #${PR_NUMBER} (SHA: ${HEAD_SHA})"
            exit 0
          fi

          echo "Found failed or cancelled runs: $(echo "$RUNS" | tr '\n' ' ')"

          RERUN_COUNT=0
          while IFS=$'\t' read -r RUN_ID RUN_CONCLUSION; do
            [ -n "$RUN_ID" ] || continue
            if [ -n "${TARGET_WORKFLOW:-}" ]; then
              WORKFLOW_NAME=$(gh run view "$RUN_ID" --json name -q .name)
              if [ "$WORKFLOW_NAME" != "$TARGET_WORKFLOW" ]; then
                echo "Skipping '${WORKFLOW_NAME}' (not '${TARGET_WORKFLOW}')"
                continue
              fi
            fi
            RERUN_MODE="$MODE"
            if [ "$RUN_CONCLUSION" = "cancelled" ]; then
              # --failed does not select cancelled jobs. Rerun the whole workflow
              # so cancelled prerequisites and their dependents run again.
              RERUN_MODE=""
              echo "Run ${RUN_ID} was cancelled; rerunning all jobs..."
            fi
            rerun_workflow "$RUN_ID" "$RERUN_MODE"
            RERUN_COUNT=$((RERUN_COUNT + 1))
          done <<< "$RUNS"

          if [ "$RERUN_COUNT" -eq 0 ] && [ -n "${TARGET_WORKFLOW:-}" ]; then
            echo "::error::No failed or cancelled workflow matching '${TARGET_WORKFLOW}' found"
            exit 1
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::${FAILURES} out of ${RERUN_COUNT} rerun(s) failed"
            exit 1
          fi
