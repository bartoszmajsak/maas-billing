name: E2E collection

# The e2e suite runs only in the group test, against a cluster, on the runner's python3
# (3.9). Collecting it here, without a cluster, catches modules that fail to import on that
# Python before they abort a group test run, or sit unnoticed off the runner's list.

on:
  pull_request:
    paths:
      - 'test/e2e/**'
      - '.github/workflows/e2e-collect.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect:
    name: Collect e2e tests
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-collect
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The group-test runner's python3.
          python-version: '3.9'
          cache: pip
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install e2e requirements
        run: pip install -r test/e2e/requirements.txt

      - name: Collect e2e tests
        working-directory: test/e2e
        run: python -m pytest --collect-only -q tests/
